<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VG+ | Private Dispatch Log — سجل الإرسال</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090c10;
      --panel: #0d1217;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --accent-green: #1e7a56;
      --accent-green-bright: #26996c;
      --text-main: #f0f3f6;
      --text-muted: #8b949e;
      --text-dim: #484f58;
      --font-mono: 'Space Mono', monospace;
      --font-heading: 'Space Grotesk', 'IBM Plex Sans Arabic', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'IBM Plex Sans Arabic', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
    }

    .frame-container {
      width: 100%;
      max-width: 820px;
      position: relative;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 36px 32px;
    }

    /* Corner Marks */
    .corner-mark { position: absolute; width: 14px; height: 14px; pointer-events: none; }
    .corner-tl { top: -1px; right: -1px; border-top: 2px solid var(--accent-green-bright); border-right: 2px solid var(--accent-green-bright); }
    .corner-tr { top: -1px; left: -1px; border-top: 2px solid var(--accent-green-bright); border-left: 2px solid var(--accent-green-bright); }
    .corner-bl { bottom: -1px; right: -1px; border-bottom: 2px solid var(--accent-green-bright); border-right: 2px solid var(--accent-green-bright); }
    .corner-br { bottom: -1px; left: -1px; border-bottom: 2px solid var(--accent-green-bright); border-left: 2px solid var(--accent-green-bright); }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 26px;
      border-bottom: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      color: var(--text-dim);
    }

    /* Lock Screen */
    .lock-box {
      max-width: 420px;
      margin: 30px auto;
      text-align: center;
    }

    .lock-title {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    .lock-sub {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .pin-field {
      width: 100%;
      padding: 12px;
      background: #06090d;
      border: 1px solid var(--border);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 1.2rem;
      text-align: center;
      letter-spacing: 6px;
      outline: none;
      margin-bottom: 14px;
    }
    .pin-field:focus {
      border-color: var(--accent-green-bright);
    }

    .btn-unlock {
      width: 100%;
      padding: 12px;
      background: var(--accent-green);
      border: 1px solid var(--accent-green-bright);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      font-weight: 700;
    }

    /* Inbox Display */
    #inboxContent {
      display: none;
    }

    .inbox-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 20px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 14px;
    }

    .inbox-title h1 {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }

    .inbox-controls {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-action:hover {
      border-color: #fff;
      color: #fff;
    }
    .btn-danger {
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.25);
    }
    .btn-danger:hover {
      border-color: #f87171;
      color: #f87171;
    }

    /* Message Item */
    .dispatch-item {
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid var(--border);
      padding: 18px 20px;
      margin-bottom: 14px;
      transition: border-color 0.15s;
    }
    .dispatch-item:hover {
      border-color: var(--border-strong);
    }

    .dispatch-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px dashed var(--border);
      font-family: var(--font-mono);
      font-size: 0.74rem;
      flex-wrap: wrap;
      gap: 8px;
    }

    .dispatch-source {
      color: var(--accent-green-bright);
      font-weight: 700;
    }

    .dispatch-time {
      color: var(--text-dim);
    }

    .dispatch-tag {
      color: #60a5fa;
      background: rgba(96, 165, 250, 0.08);
      border: 1px solid rgba(96, 165, 250, 0.2);
      padding: 2px 8px;
      font-size: 0.7rem;
    }

    .dispatch-text {
      color: #e6edf3;
      font-size: 0.98rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .btn-del-msg {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      cursor: pointer;
      padding: 2px 6px;
    }
    .btn-del-msg:hover {
      color: #ef4444;
    }

    .empty-notice {
      text-align: center;
      padding: 50px 20px;
      border: 1px dashed var(--border);
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="frame-container">
    <div class="corner-mark corner-tl"></div>
    <div class="corner-mark corner-tr"></div>
    <div class="corner-mark corner-bl"></div>
    <div class="corner-mark corner-br"></div>

    <div class="meta-bar">
      <span>VG-LOG // ARCHIVE-CONSOLE</span>
      <span>SECURITY PIN PROTECTED</span>
    </div>

    <!-- Lock State -->
    <div id="lockState" class="lock-box">
      <h2 class="lock-title">سجل الوارد الخاص بـ VG+</h2>
      <p class="lock-sub">هذه القائمة محصورة بقيادة الفريق. أدخل رمز الوصول السري للمتابعة.</p>
      <form onsubmit="handleAuth(event)">
        <input type="password" id="pinInput" class="pin-field" placeholder="••••" required autofocus />
        <button type="submit" class="btn-unlock">[ تحقق من الصلاحية ➔ ]</button>
      </form>
    </div>

    <!-- Inbox Logs Content -->
    <div id="inboxContent">
      <div class="inbox-header">
        <div class="inbox-title">
          <h1>سجل الإرسال الداخلي (<span id="msgCount">0</span>)</h1>
        </div>
        <div class="inbox-controls">
          <button class="btn-action" onclick="fetchMessages()">[ تحديث ↻ ]</button>
          <button class="btn-action btn-danger" onclick="clearAllDispatches()">[ مسح السجل ]</button>
          <button class="btn-action" onclick="lockConsole()">[ قفل 🔒 ]</button>
        </div>
      </div>

      <div id="dispatchesList"></div>
    </div>
  </div>

  <script>
    let activeKey = sessionStorage.getItem('vg_pin') || '';

    const lockState = document.getElementById('lockState');
    const inboxContent = document.getElementById('inboxContent');
    const pinInput = document.getElementById('pinInput');
    const msgCount = document.getElementById('msgCount');
    const dispatchesList = document.getElementById('dispatchesList');

    if (activeKey) {
      verifyKey(activeKey, false);
    }

    async function handleAuth(e) {
      e.preventDefault();
      verifyKey(pinInput.value.trim(), true);
    }

    async function verifyKey(pin, isManual) {
      try {
        const res = await fetch('/api/auth/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin })
        });
        if (res.ok) {
          activeKey = pin;
          sessionStorage.setItem('vg_pin', pin);
          lockState.style.display = 'none';
          inboxContent.style.display = 'block';
          fetchMessages();
        } else {
          if (isManual) alert('رمز المرور غير صحيح.');
          else sessionStorage.removeItem('vg_pin');
        }
      } catch (err) {
        if (isManual) alert('تعذر الاتصال بالخادم.');
      }
    }

    function lockConsole() {
      sessionStorage.removeItem('vg_pin');
      activeKey = '';
      inboxContent.style.display = 'none';
      lockState.style.display = 'block';
    }

    async function fetchMessages() {
      if (!activeKey) return;
      try {
        const res = await fetch('/api/messages', {
          headers: { 'x-admin-pin': activeKey }
        });
        if (res.status === 401) { lockConsole(); return; }
        const data = await res.json();
        if (data.success) renderDispatches(data.messages);
      } catch (e) {
        console.error(e);
      }
    }

    function renderDispatches(messages) {
      msgCount.textContent = messages.length;
      if (messages.length === 0) {
        dispatchesList.innerHTML = '<div class="empty-notice">[ NO DISPATCHES LOGGED YET // السجل فارغ ]</div>';
        return;
      }

      dispatchesList.innerHTML = messages.map(msg => `
        <div class="dispatch-item">
          <div class="dispatch-meta">
            <div>
              <span class="dispatch-source">SOURCE: ${escapeHtml(msg.avatar ? msg.avatar.name : 'ANONYMOUS')}</span>
              <span class="dispatch-tag">${escapeHtml(msg.tag || 'GENERAL')}</span>
            </div>
            <div>
              <span class="dispatch-time">${msg.formattedTime || 'RECENT'}</span>
              <button class="btn-del-msg" onclick="deleteDispatch('${msg.id}')">[ DELETE ]</button>
            </div>
          </div>
          <div class="dispatch-text">${escapeHtml(msg.text)}</div>
        </div>
      `).join('');
    }

    async function deleteDispatch(id) {
      if (!confirm('تأكيد حذف هذا الإرسال؟')) return;
      const res = await fetch(`/api/messages/${id}`, { method: 'DELETE', headers: { 'x-admin-pin': activeKey } });
      const data = await res.json();
      if (data.success) fetchMessages();
    }

    async function clearAllDispatches() {
      if (!confirm('تأكيد مسح كافة الرسائل من السجل؟')) return;
      const res = await fetch('/api/messages', { method: 'DELETE', headers: { 'x-admin-pin': activeKey } });
      const data = await res.json();
      if (data.success) fetchMessages();
    }

    function escapeHtml(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }

    setInterval(() => { if (activeKey) fetchMessages(); }, 5000);
  </script>
</body>
</html>
